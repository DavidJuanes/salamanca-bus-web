story:
  kicker: Funciones
  title: Todo lo que necesitas en la parada
  intro: Seis paradas por la app. Baja la página y el móvil te enseña cada pantalla.
  nearby:
    title: Cerca de ti
    text: Tus paradas favoritas y las más cercanas, con las próximas llegadas de cada línea y a qué distancia está el autobús.
    in: "en %m min"
    now: Llegando
    first_away: a 780 m
    first_then: luego en 16 min
    second_away: a 1,4 km
    second_then: luego en 18 min
    chips: [Se actualiza solo, Distancia al bus, Búsqueda por número o nombre]
    alt: Pantalla Cerca con las favoritas y las paradas cercanas
  stop:
    title: Reconoce tu parada
    text: Cada parada tiene su foto de Street View, una brújula que te indica hacia dónde está y las llegadas de todas sus líneas.
    detail: Parada 222 · a 290 m, hacia el noreste
    chips: ["✎ Renómbrala: «Trabajo»", ★ Favorita, Compartir]
    alt: Detalle de la parada Gran Vía, 38 con su foto
  lines:
    title: Todas las líneas
    text: Diurnas y nocturnas, con su recorrido de ida y vuelta, su frecuencia y si están en servicio ahora mismo, también en festivos.
    active: ● Activa
    chips: [Cada 10 min, Ida y vuelta, Nocturnas N-1 y N-2]
    alt: Recorrido de la línea 4, Cementerio - Puente Ladrillo
  map:
    title: Toda la red en el mapa
    text: Todas las paradas y el recorrido real de las líneas por las calles. Combina las líneas que quieras y toca una parada para ver sus llegadas o cómo llegar a pie.
    legend: Las 17 líneas
    chips: [346 paradas, Cómo llegar a pie, Modo oscuro]
    alt: Mapa de Salamanca con varias líneas
  fares:
    title: Tarifas al día
    text: Billetes, bonos y abonos con su precio vigente, para saber qué te conviene antes de subir.
    tickets:
      - { name: Billete ordinario, price: "1,20 €" }
      - { name: Bono-Bus, price: "0,37 €", unit: por viaje }
      - { name: Abono joven, price: "7,34 €", unit: al mes }
    chips: [Vigentes desde el 1 de enero de 2026]
    alt: Pantalla de tarifas
  yours:
    title: A tu manera
    text: Elige cómo ver los tiempos, el tema y el idioma. Funciona con TalkBack y con letra grande.
    toggle: "Formato de llegada: en minutos o en hora"
    relative: en 2 min
    clock: "10:02"
    chips: [◐ Claro y oscuro, ES · EN, Aa Letra grande, TalkBack]
