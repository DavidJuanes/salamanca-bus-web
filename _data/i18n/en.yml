story:
  kicker: Features
  title: Everything you need at the stop
  intro: Six stops along the app. Scroll down and the phone shows you each screen.
  nearby:
    title: Near you
    text: Your favourite stops and the closest ones, with the next arrivals of every line and how far away the bus is.
    in: "in %m min"
    now: Arriving
    first_away: 780 m away
    first_then: then in 16 min
    second_away: 1.4 km away
    second_then: then in 18 min
    chips: [Updates by itself, Distance to the bus, Search by number or name]
    alt: Nearby screen with favourite and nearby stops
  stop:
    title: Recognise your stop
    text: Every stop has its Street View photo, a compass that points the way, and the arrivals of all its lines.
    detail: Stop 222 · 290 m away, to the north-east
    chips: ["✎ Rename it: “Work”", ★ Favourite, Share]
    alt: Gran Vía, 38 stop detail with its photo
  lines:
    title: Every line
    text: Day and night lines, with their outbound and return routes, how often they run and whether they're running right now, bank holidays included.
    active: ● Running
    chips: [Every 10 min, Outbound and return, Night lines N-1 and N-2]
    alt: Route of line 4, Cementerio - Puente Ladrillo
  map:
    title: The whole network on a map
    text: Every stop and the real route of each line through the streets. Combine any lines you like and tap a stop to see its arrivals or walking directions.
    legend: The 17 lines
    chips: [346 stops, Walking directions, Dark mode]
    alt: Map of Salamanca with several lines
  fares:
    title: Up-to-date fares
    text: Tickets, multi-trip cards and passes with their current price, so you know what suits you before you board.
    tickets:
      - { name: Single ticket, price: "€1.20" }
      - { name: Bono-Bus card, price: "€0.37", unit: per trip }
      - { name: Youth pass, price: "€7.34", unit: per month }
    chips: [Valid from 1 January 2026]
    alt: Fares screen
  yours:
    title: Your way
    text: Choose how to see arrival times, the theme and the language. Works with TalkBack and large text.
    toggle: "Arrival format: minutes or clock time"
    relative: in 2 min
    clock: "10:02"
    chips: [◐ Light and dark, ES · EN, Aa Large text, TalkBack]
    alt: Nearby screen in dark mode, with times in minutes

